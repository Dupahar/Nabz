# Customer segments a visit can be tagged with (market intelligence is sliced by these).
segments: [Kirana, Chemist, Modern trade, Wholesaler, Doctor, Retail chain, Other]

# Words the speech model must get right. They are sent to Prisma as `keyterms` with every
# recording, together with account (business) names from the CRM. People's names are never sent.
vocabulary:
  products: [Parle-G, Maggi, Sunfeast, Mom's Magic, Tata Tea, Aashirvaad, Dettol, Northwind POS]
  competitors: [Britannia, Patanjali, Haldiram, Zoho, Vyapar]
  terms: [GST, lakh, crore, carton, peti, scheme, credit, UPI, SKU, display, MRP]

speech:
  engine: prisma            # prisma (Gnani AI) or whisper (local fallback)
  model: prisma-v3.0
  language: indic-auto      # or e.g. "hi-IN,en-IN" or "kn-IN"
  format: codemix           # English words stay in Latin script inside Indian-language speech
  denoise: false            # our benchmark: with_denoise RAISED word error 12.7% -> 21.4% at 10 dB SNR (benchmark/README.md)
  max_speakers: 3

llm:
  fast_model: claude-haiku-5-5    # every visit; ~Rs 0.3 per visit
  deep_model: claude-opus-5-5     # only when a visit needs it (see escalation reasons in tools/llm.py)
  fast_effort: medium
  deep_effort: medium
  max_retries_on_check: 1         # re-ask once if quotes fail verification
  long_visit_minutes: 20          # longer visits go to the deep model

voice_debrief:
  enabled: true
  model: timbre-v3.0
  voice: Shivani            # Timbre v3.0 voices speak all ten languages
  default_language: hi-en

privacy:
  consent_required: true    # DPDP Act 2023 s.5-6: no processing without a recorded notice + consent
  redact_pii: true          # Aadhaar, PAN, GSTIN, phone, email, card and account numbers
  retain_audio_days: 1      # raw audio is deleted within a day of processing (tools/retention.py)
  retain_transcripts_days: 365

auth:
  # demo_mode: the login page lists names and roles to pick from (PIN still required).
  # Set false in production and use real SSO/OIDC in front of the app.
  demo_mode: true
  session_days: 7
  max_failed_logins: 5      # per handle and IP, per 15 minutes

server:
  workers: 3                # visits processed in parallel
  max_upload_mb: 50
  max_minutes: 60           # longest recording accepted
  min_seconds: 5
  step_timeout_minutes: 20  # any single processing step
  prisma_timeout_minutes: 15
  stalled_after_minutes: 20 # the UI offers "Retry" after this long without progress
  retention_interval_hours: 6

# Rupee rates for cost-per-visit reporting (tools/cost.py, /api/cost). ESTIMATES until Gnani quotes us:
#   prisma: Rs 27/audio-hour reseller list price (callmissed.com, Nov 2026) -> 0.45/min
#   timbre: no public price; Sarvam Bulbul TTS (Rs 1 per 1k chars) used as a proxy
#   llm:    Claude Haiku 5.5 list price, blended (~$0.45 per 1M tokens at our in/out mix) -> ~Rs 0.04/1k tokens.
#           Per-visit LLM cost is also logged exactly (usage.jsonl cost_inr) and used when present.
rates_inr:
  prisma_per_min: 0.45
  timbre_per_1k_chars: 1.0
  llm_per_1k_tokens: 0.04
