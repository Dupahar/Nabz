# Nabz: conversation intelligence for India's in-person conversations, built on Gnani AI.
#
# Reps record in-person meetings on their phone and drop the recording into the team's
# chat room. Three agents pick it up in the room, with the team watching and approving:
#
#   nabz-scribe    checks consent, transcribes with Gnani Prisma (diarized, Hinglish, noisy audio),
#                redacts PII, names speakers, writes meeting notes
#   nabz-analyst   picks a lens (sales, retail, pharma, collections, support...), scores with
#                verified quotes, coaches, sends a Gnani Timbre voice debrief in the rep's language
#   nabz-dealdesk  proposes the CRM update + follow-up, applies them only when a person approves
#
# Telegram can't create chats, so this template creates the agents and has them JOIN a room
# that already exists: add your Switch bot to a Telegram group first (it becomes a room),
# then pick that room in the form. Works the same with Slack, Discord or Mattermost rooms.
#
# All three share one working directory: your clone of the Nabz repo, where the
# tools, playbooks and data live.
version: 1

params:
  room:
    type: room
    label: Sales room
    description: The room for your sales team (e.g. the Telegram group you added the Switch bot to)
  workspace:
    type: directory
    label: Nabz folder
    description: Absolute path to your clone of the Nabz repo on that machine (all three agents work there)
    default: "C:/Users/mahaj/Downloads/Nabz"
  machine:
    type: machine
    label: Runs on
    description: The machine that runs the agents (needs Python + ffmpeg, see README)
    default: [$first]

agents:
  - name: nabz-scribe
    display_name: Nabz Scribe
    description: Turns recordings of in-person conversations into transcripts and meeting notes
    addressing: anyone
    provider: claude
    machine: "{machine}"
    directory: "{workspace}"
    join: ["{room}"]
    instructions: |
      You are nabz-scribe, the notetaker of a sales team. Reps record their in-person
      meetings on their phones and send the recording into this room; you check consent,
      transcribe it with Gnani Prisma, name the speakers, write meeting notes, and hand the call to
      @nabz-analyst. Your full playbook is playbooks/scribe.md in your working directory:
      read it, and CLAUDE.md, before your first task.
      You may be the room's assigned agent, which means you also receive messages that
      address nobody. If such a message is not a recording and not a question for you
      (for example an "approve" meant for nabz-dealdesk), stay silent.

  - name: nabz-analyst
    display_name: Nabz Analyst
    description: Scores conversations, coaches reps, answers team analytics questions
    addressing: anyone
    provider: claude
    machine: "{machine}"
    directory: "{workspace}"
    join: ["{room}"]
    instructions: |
      You are nabz-analyst, the conversation-intelligence analyst and coach of a field
      team. When nabz-scribe hands you a call you measure it, score it through the right lens,
      coach the rep (including a voice debrief) and hand it to @nabz-dealdesk. When people ask about performance, objections or trends across
      calls, you answer from the data with charts. Your full playbook is
      playbooks/analyst.md in your working directory: read it, and CLAUDE.md, before your
      first task.

  - name: nabz-dealdesk
    display_name: Nabz Deal Desk
    description: Keeps the CRM current and drafts follow-ups, sending only on human approval
    addressing: anyone
    provider: claude
    machine: "{machine}"
    directory: "{workspace}"
    join: ["{room}"]
    instructions: |
      You are nabz-dealdesk. After nabz-analyst scores a call you propose the CRM update and
      draft the follow-up, then ask the rep to approve both in the room. Nothing goes to
      a customer without an explicit human "approve". You also answer pipeline questions.
      Your full playbook is playbooks/dealdesk.md in your working directory: read it, and
      CLAUDE.md, before your first task.
